spring:
  application:
    name: fleet-telematics

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:fleet_telematics}
    username: ${DB_USER:fleet}
    password: ${DB_PASSWORD:fleet_local_dev}
    hikari:
      pool-name: fleet-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

fleet:
  websocket:
    endpoint: /ws
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
    topic-telemetry: /topic/telemetry
    topic-alerts: /topic/alerts
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    auto-start: ${SIMULATOR_AUTO_START:true}
    tick-millis: 2000
    speeding-threshold-kph: 90
    low-fuel-threshold-pct: 12

logging:
  level:
    org.example.b2blogistics: INFO
    org.hibernate.SQL: WARN
