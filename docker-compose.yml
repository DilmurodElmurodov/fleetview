services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: fleet-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fleet_telematics}
      POSTGRES_USER: ${DB_USER:-fleet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fleet_local_dev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${DB_HOST_PORT:-5435}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fleet} -d ${DB_NAME:-fleet_telematics}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb

  backend:
    build: .
    container_name: fleet-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fleet_telematics}
      DB_USER: ${DB_USER:-fleet}
      DB_PASSWORD: ${DB_PASSWORD:-fleet_local_dev}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_HOST_PORT:-8086}:8080"

  frontend:
    build: ./frontend
    container_name: fleet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  postgis-data:
